<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>claude-web · 终端交互原型</title><style>/*
 * claude-web 设计 token。实现时原样复制到 web/src/styles/tokens.css。
 * 组件里只能用这些变量（经 ui.md 第 2 节映射成 Tailwind 类），不允许出现裸色值。
 * 命名刻意避开 Tailwind v4 的主题命名空间（--color-* / --text-* / --font-* / --radius-* / --shadow-* / --ease-*）。
 * 主题：<html data-theme="light|dark">；没有 data-theme 时跟随系统。
 */

:root {
  /* 背景与表面 */
  --bg: #fafaf9;            /* 页面底色、对话区 */
  --surface: #ffffff;       /* 卡片、工具行、输入框、选中的会话项 */
  --surface-2: #f4f4f2;     /* 侧栏、用户消息、代码块、工具输出 */
  --surface-3: #ebebe8;     /* hover / 按下 */
  --line: #e4e4e0;
  --line-strong: #d4d4cf;   /* 输入框、次要按钮边框 */

  /* 文字 */
  --fg: #1c1c1a;
  --fg-2: #57574f;          /* 次要文字、摘要 */
  --fg-3: #8a8a82;          /* 元信息、时间、占位符 */

  /* 强调色：只用于主按钮、运行中状态、选中态、链接 */
  --accent: #3d63dd;
  --accent-fg: #ffffff;
  --accent-soft: #ebf0fd;

  /* 语义色 */
  --warn: #b76e00;          /* 待确认 */
  --warn-soft: #fff4e0;
  --warn-border: #f2c46d;
  --danger: #c93c37;
  --danger-fg: #ffffff;
  --danger-soft: #fdeceb;
  --success: #2e8a4e;
  --success-soft: #e7f5ec;

  /* diff */
  --diff-add-bg: #e6f4ea;
  --diff-add-fg: #1f6f3a;
  --diff-del-bg: #fcebea;
  --diff-del-fg: #a8322d;

  /* 字体 */
  --ff-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC",
    "Microsoft YaHei", sans-serif;
  --ff-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas,
    "Noto Sans Mono CJK SC", monospace;

  /* 字号 / 行高（只用这几档） */
  --fs-xs: 12px;   --lh-xs: 16px;   /* 元信息、徽标 */
  --fs-sm: 13px;   --lh-sm: 20px;   /* 界面文字、工具行、侧栏 */
  --fs-base: 14px; --lh-base: 22px; /* 按钮、标题栏 */
  --fs-chat: 15px; --lh-chat: 26px; /* 对话正文 */
  --fs-md: 16px;   --lh-md: 24px;   /* 手机输入框（防 iOS 缩放）、手机会话标题 */
  --fs-lg: 18px;   --lh-lg: 26px;   /* 页面标题 */
  --fs-code: 12.5px; --lh-code: 19px;

  /* 圆角 */
  --r-sm: 4px;   /* 行内代码、徽标 */
  --r: 6px;      /* 按钮、工具行、代码块、会话项 */
  --r-lg: 10px;  /* 消息、卡片、输入框 */
  --r-xl: 14px;  /* 底部弹层顶部 */
  --r-full: 999px;

  /* 阴影：只给浮层（抽屉、弹窗、下拉菜单、底部弹层） */
  --elev-overlay: 0 8px 28px rgb(0 0 0 / 0.12), 0 1px 3px rgb(0 0 0 / 0.08);

  /* 布局尺寸。侧栏、面板宽度可拖动，--*-w 是默认值，实际宽度由前端写到同名变量上 */
  --sidebar-w: 280px;
  --sidebar-w-min: 220px;
  --sidebar-w-max: 420px;
  --panel-w: 480px;
  --panel-w-min: 360px;
  --panel-w-max: 800px;
  --chat-min: 480px;        /* 对话区最小宽度，侧栏/面板变宽不能挤到它以下 */
  --chat-max: 760px;
  --topbar-h: 48px;
  --topbar-h-mobile: 52px;

  /* 动效 */
  --motion-ease: cubic-bezier(0.2, 0, 0, 1);
  --motion-dur: 150ms;

  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #151514;
  --surface: #1c1c1b;
  --surface-2: #232321;
  --surface-3: #2c2c2a;
  --line: #2f2f2c;
  --line-strong: #3d3d39;
  --fg: #ecece8;
  --fg-2: #b4b4ac;
  --fg-3: #85857d;
  --accent: #7b9cff;
  --accent-fg: #10131c;
  --accent-soft: #1f2840;
  --warn: #e8a33d;
  --warn-soft: #2e2414;
  --warn-border: #5c4318;
  --danger: #f07a75;
  --danger-fg: #1c0f0e;
  --danger-soft: #3a1e1d;
  --success: #5cc27f;
  --success-soft: #17301f;
  --diff-add-bg: #15301f;
  --diff-add-fg: #7ad69a;
  --diff-del-bg: #3a1d1c;
  --diff-del-fg: #f4908b;
  --elev-overlay: 0 8px 28px rgb(0 0 0 / 0.5), 0 1px 3px rgb(0 0 0 / 0.4);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #151514;
    --surface: #1c1c1b;
    --surface-2: #232321;
    --surface-3: #2c2c2a;
    --line: #2f2f2c;
    --line-strong: #3d3d39;
    --fg: #ecece8;
    --fg-2: #b4b4ac;
    --fg-3: #85857d;
    --accent: #7b9cff;
    --accent-fg: #10131c;
    --accent-soft: #1f2840;
    --warn: #e8a33d;
    --warn-soft: #2e2414;
    --warn-border: #5c4318;
    --danger: #f07a75;
    --danger-fg: #1c0f0e;
    --danger-soft: #3a1e1d;
    --success: #5cc27f;
    --success-soft: #17301f;
    --diff-add-bg: #15301f;
    --diff-add-fg: #7ad69a;
    --diff-del-bg: #3a1d1c;
    --diff-del-fg: #f4908b;
    --elev-overlay: 0 8px 28px rgb(0 0 0 / 0.5), 0 1px 3px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion-dur: 0ms; }
}

* {
  box-sizing: border-box;
}
html,
body,
#root {
  margin: 0;
  width: 100%;
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--fg);
  font: var(--fs-sm)/var(--lh-sm) var(--ff-sans);
  overflow: hidden;
}
#root {
  display: flex;
  flex-direction: column;
}
button,
input,
select {
  color: inherit;
  font: inherit;
}
button {
  cursor: pointer;
}
button,
input {
  -webkit-tap-highlight-color: transparent;
}
button:disabled {
  opacity: 0.4;
  cursor: default;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button {
  border: 0;
  background: transparent;
}
button:hover:not(:disabled) {
  background: var(--surface-3);
}
svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke-width: 1.75;
}
code,
pre {
  font-family: var(--ff-mono);
}
.icon {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: var(--r);
  color: var(--fg-2);
}
.button {
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  background: var(--surface);
  font-size: var(--fs-base);
  font-weight: 500;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
}
.button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.button.danger-button {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-fg);
}
.button.primary:hover,
.button.danger-button:hover {
  filter: brightness(0.94);
}
.prototype-bar {
  flex: none;
  min-height: 40px;
  padding: 4px 12px;
  border-bottom: 1px solid var(--line-strong);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.prototype-bar > span,
.prototype-bar > div {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.prototype-bar b {
  font-weight: 600;
  white-space: nowrap;
}
.prototype-note {
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.prototype-bar select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  min-height: 30px;
  padding: 0 8px;
  max-width: 130px;
}
.app {
  flex: 1;
  min-height: 0;
  display: flex;
  padding-top: env(safe-area-inset-top);
}
.sidebar {
  width: 280px;
  flex-shrink: 0;
  border-right: 1px solid var(--line);
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.side-head {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px 0 16px;
}
.side-head strong {
  font-size: var(--fs-base);
}
.search {
  margin: 0 12px 16px;
  padding: 0 10px;
  height: 32px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-3);
}
.side-list {
  flex: 1;
  overflow: auto;
  padding: 0 8px;
}
.group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 4px 4px;
  color: var(--fg-3);
  font-size: var(--fs-xs);
  font-weight: 600;
}
.group span {
  margin-left: 2px;
  font-weight: 400;
}
.session {
  width: 100%;
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  row-gap: 4px;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: var(--r);
  text-align: left;
}
.session.selected {
  background: var(--surface);
  border-color: var(--line);
}
.session > span:nth-child(2) {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.session small {
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.session > div {
  grid-column: 2 / 4;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  border-radius: var(--r-full);
  background: var(--fg-3);
}
.dot.offline {
  background: var(--warn);
}
.side-bottom {
  padding: 12px;
  color: var(--fg-2);
  border-top: 1px solid var(--line);
}
.side-bottom > div:first-child {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-xs);
}
.side-bottom small {
  display: block;
  margin-top: 12px;
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.meter {
  height: 4px;
  background: var(--line);
  border-radius: var(--r-full);
  margin-top: 6px;
  overflow: hidden;
}
.meter i {
  display: block;
  width: 34%;
  height: 100%;
  background: var(--fg-2);
}
.workspace {
  flex: 1;
  display: flex;
  min-width: 0;
  min-height: 0;
}
.conversation {
  display: flex;
  flex-direction: column;
  min-width: 480px;
  flex: 1;
}
.topbar {
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 48px;
  padding: 0 12px 0 20px;
  border-bottom: 1px solid var(--line);
}
.topbar > div {
  flex: 1;
  min-width: 0;
}
.topbar strong {
  display: block;
  font-size: var(--fs-base);
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.topbar small {
  display: block;
  font: var(--fs-xs)/var(--lh-xs) var(--ff-mono);
  color: var(--fg-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.badge {
  height: 22px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--fg-2);
  font-size: var(--fs-xs);
  background: var(--surface-2);
  border-radius: var(--r-full);
}
.chat {
  flex: 1;
  min-height: 0;
  overflow: auto;
  width: 100%;
  max-width: 760px;
  align-self: center;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  font: var(--fs-chat)/var(--lh-chat) var(--ff-sans);
}
.chat p {
  margin: 0;
}
.user-message {
  align-self: flex-end;
  max-width: 85%;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface-2);
}
.chat p code {
  font-size: var(--fs-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 0 4px;
}
.tool {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  min-height: 34px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  font-size: var(--fs-sm);
}
.tool code {
  flex: 1;
  font-size: var(--fs-code);
  color: var(--fg-2);
}
.tool svg:last-child {
  color: var(--success);
}
.result {
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.result::before,
.result::after {
  content: '';
  height: 1px;
  background: var(--line);
  flex: 1;
}
.chat-compose {
  flex: none;
  margin: 0 24px max(16px, env(safe-area-inset-bottom));
  border: 1px solid var(--line-strong);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.chat-compose > div {
  padding: 12px 14px 10px;
  color: var(--fg-3);
  font-size: var(--fs-chat);
}
.chat-compose footer {
  display: flex;
  gap: 8px;
  align-items: center;
  height: 44px;
  padding: 0 10px;
  border-top: 1px solid var(--line);
  color: var(--fg-2);
}
.grow {
  flex: 1;
}
.panel {
  position: relative;
  width: var(--terminal-panel-width);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex-shrink: 0;
  background: var(--bg);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 48px;
  flex: none;
  padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--line);
}
.panel-head > div {
  display: flex;
  height: 100%;
}
.panel-head > div button {
  padding: 0 10px;
  border-bottom: 2px solid transparent;
  color: var(--fg-2);
}
.panel-head > div button.active {
  color: var(--fg);
  border-bottom-color: var(--fg);
  font-weight: 600;
}
.focus-mode .workspace > .conversation {
  display: none;
}
.focus-mode .workspace > .panel {
  flex: 1;
  width: auto;
}
.terminal {
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.terminal-toolbar {
  display: flex;
  flex: none;
  align-items: center;
  height: 38px;
  border-bottom: 1px solid var(--line);
  padding-right: 4px;
}
.term-tabs {
  display: flex;
  flex: 1;
  overflow-x: auto;
  min-width: 0;
  height: 100%;
  scrollbar-width: thin;
}
.term-tabs button {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  color: var(--fg-3);
  white-space: nowrap;
  border-right: 1px solid var(--line);
  border-bottom: 2px solid transparent;
}
.term-tabs button.chosen {
  color: var(--fg);
  background: var(--surface);
  border-bottom-color: var(--fg-3);
}
.term-tabs small {
  font-size: var(--fs-xs);
}
.terminal-actions {
  display: flex;
  flex-shrink: 0;
}
.directory {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  flex: none;
  min-width: 0;
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.directory span {
  white-space: nowrap;
}
.directory code {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.directory svg {
  width: 14px;
  height: 14px;
}
.screen {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 14px 16px;
  font: var(--fs-code)/var(--lh-code) var(--ff-mono);
  tab-size: 4;
}
.line {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: var(--lh-code);
}
.line.command {
  color: var(--fg);
  font-weight: 500;
}
.line.muted {
  color: var(--fg-3);
}
.line.success {
  color: var(--success);
}
.line.accent {
  color: var(--accent);
}
.screen-prompt {
  color: var(--fg-2);
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.cursor {
  display: inline-block;
  width: 7px;
  height: 15px;
  vertical-align: text-bottom;
  background: var(--fg-3);
}
.terminal-input {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 8px 0 16px;
  border-top: 1px solid var(--line);
  font-family: var(--ff-mono);
}
.terminal-input > span {
  color: var(--fg-3);
}
.terminal-input input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  padding: 8px 0;
  font-size: var(--fs-code);
}
.terminal-input input::placeholder {
  color: var(--fg-3);
  font-family: var(--ff-sans);
}
.ctrl-c {
  font-family: var(--ff-mono);
  font-size: var(--fs-sm);
}
.terminal-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 12px;
  border-top: 1px solid var(--line);
  color: var(--fg-3);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
}
.terminal-status > span:first-child {
  display: flex;
  gap: 6px;
  align-items: center;
}
.terminal-status .dot {
  width: 6px;
  height: 6px;
}
.terminal-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--fg-2);
  padding: 24px;
}
.terminal-empty > svg {
  width: 24px;
  height: 24px;
  margin-bottom: 2px;
  color: var(--fg-3);
}
.terminal-empty strong {
  font-size: var(--fs-base);
  font-weight: 500;
}
.terminal-empty code {
  color: var(--fg-3);
  font-size: var(--fs-xs);
  word-break: break-all;
}
.terminal-empty .button {
  margin-top: 6px;
}
.connection {
  display: flex;
  flex: none;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  min-height: 32px;
  padding: 4px 12px;
  background: var(--warn-soft);
  color: var(--warn);
  font-size: var(--fs-xs);
}
.connection button {
  color: inherit;
  white-space: nowrap;
  padding: 0;
  text-decoration: underline;
}
.exit-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--line);
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.resize {
  position: absolute;
  inset: 0 auto 0 -4px;
  width: 8px;
  cursor: col-resize;
  touch-action: none;
}
.resize::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 3px;
  width: 2px;
}
.resize:hover::after,
.resize:focus-visible::after {
  background: var(--accent);
}
.file-view {
  overflow: auto;
  padding: 8px 0;
}
.file-view > div {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
}
.file-view svg {
  color: var(--fg-3);
}
.diff-view {
  overflow: auto;
  font-size: var(--fs-code);
}
.diff-view header {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.diff-view header span {
  color: var(--fg-3);
  font-size: var(--fs-xs);
}
.diff-file {
  padding: 8px 12px;
  font-family: var(--ff-mono);
}
.diff-view pre {
  margin: 0;
  padding: 4px 12px;
  width: max-content;
  min-width: 100%;
}
.removed {
  color: var(--diff-del-fg);
  background: var(--diff-del-bg);
}
.added {
  color: var(--diff-add-fg);
  background: var(--diff-add-bg);
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--fg) 32%, transparent);
}
.close-dialog {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, calc(100vw - 32px));
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--elev-overlay);
  z-index: 60;
}
.close-dialog h2 {
  font-size: var(--fs-md);
  margin: 0 0 8px;
  font-weight: 600;
}
.close-dialog p {
  color: var(--fg-2);
  margin: 0;
}
.close-summary {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 20px 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: var(--fs-xs);
}
.close-summary code {
  color: var(--fg-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.close-dialog footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.toast {
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%);
  max-width: calc(100vw - 32px);
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  box-shadow: var(--elev-overlay);
}
.tablet-drawer {
  position: fixed;
  z-index: 45;
  right: 0;
  top: 0;
  bottom: 0;
  width: min(480px, 90vw);
  box-shadow: var(--elev-overlay);
  background: var(--bg);
}
.tablet-drawer.full {
  width: 100%;
}
.tablet-drawer .panel {
  width: 100%;
  height: 100%;
}
.mobile-nav,
.aux-keys {
  display: none;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}
@media (min-width: 640px) and (max-width: 1023px) {
  .conversation {
    min-width: 0;
  }
}
@media (max-width: 639px) {
  .prototype-bar {
    padding: 4px 8px;
    gap: 4px;
  }
  .prototype-bar > span {
    display: block;
    line-height: var(--lh-xs);
  }
  .prototype-bar b {
    font-size: var(--fs-xs);
  }
  .prototype-note {
    display: block;
  }
  .prototype-bar > div {
    gap: 2px;
  }
  .prototype-bar select {
    max-width: 98px;
    min-height: 40px;
  }
  .desktop {
    display: none;
  }
  .icon {
    width: 40px;
    height: 40px;
  }
  .button {
    min-height: 40px;
  }
  .conversation {
    min-width: 0;
    width: 100%;
  }
  .topbar {
    min-height: 52px;
    padding: 0 6px;
    gap: 4px;
    border: 0;
  }
  .topbar strong {
    font-size: var(--fs-md);
  }
  .topbar svg {
    width: 20px;
    height: 20px;
  }
  .mobile-nav {
    display: flex;
    margin: 0 16px 8px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface-2);
  }
  .mobile-nav button {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    border-radius: var(--r-sm);
    color: var(--fg-2);
  }
  .mobile-nav button.active {
    background: var(--surface);
    color: var(--fg);
    font-weight: 600;
    outline: 1px solid var(--line);
  }
  .panel {
    flex: 1;
    width: 100%;
    border: 0;
    border-top: 1px solid var(--line);
  }
  .panel-head {
    display: none;
  }
  .terminal-toolbar {
    height: 44px;
  }
  .term-tabs button {
    min-height: 40px;
  }
  .directory {
    padding: 8px 12px;
  }
  .screen {
    padding: 12px;
  }
  .terminal-input {
    padding-left: 12px;
  }
  .terminal-input input {
    font-size: var(--fs-md);
  }
  .aux-keys {
    display: flex;
    gap: 2px;
    flex: none;
    padding: 2px 4px;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
  .aux-keys button {
    flex: 1;
    min-width: 40px;
    height: 40px;
    padding: 0;
    border-radius: var(--r);
    color: var(--fg-2);
    font-size: var(--fs-xs);
    font-family: var(--ff-mono);
  }
  .aux-keys button.pressed {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .terminal-status {
    padding-bottom: max(5px, env(safe-area-inset-bottom));
  }
  .connection button {
    min-height: 40px;
  }
  .sidebar {
    width: 100%;
    border: 0;
    background: var(--bg);
  }
  .side-head {
    height: 52px;
  }
  .side-head strong {
    font-size: var(--fs-lg);
  }
  .session {
    min-height: 64px;
  }
  .chat {
    padding: 16px;
  }
  .chat-compose {
    margin: 0 12px max(12px, env(safe-area-inset-bottom));
  }
  .chat-compose > div {
    font-size: var(--fs-md);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
